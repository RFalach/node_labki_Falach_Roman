services:
  app:
    build:
      context: .
      target: production
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOSTNAME=0.0.0.0
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=fastify
      - MYSQL_PASSWORD=fastify123
      - MYSQL_DB=inventory
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=jwt-secret-32-characters-minimum!!
      - SESSION_SECRET=session-secret-32-chars-long!!
      - ADMIN_API_KEY=supersecretkey
      - USD_TO_UAH=41.5
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mariadb:11
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=inventory
      - MYSQL_USER=fastify
      - MYSQL_PASSWORD=fastify123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data: